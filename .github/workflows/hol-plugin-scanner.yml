name: HOL Plugin Scanner

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: hashgraph-online/ai-plugin-scanner-action@6baac0e7549b0884c2d51dff3d1503a742d1d3a7  # v1.2.389
        with:
          plugin_dir: "."
          fail_on_severity: high
          install_source: pypi
          install_cisco: "false"
          submission_enabled: "false"
          write_step_summary: "true"
